<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TubeDigest AI Studio 4.0</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 360px;
            background: linear-gradient(180deg, #070b14 0%, #02050c 100%);
            color: #f8fafc;
            font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1.5px solid rgba(255, 255, 255, 0.12);
            padding-bottom: 16px;
            margin-bottom: 18px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-icon {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: linear-gradient(135deg, #ff0055 0%, #7c3aed 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            font-weight: 900;
            box-shadow: 0 4px 16px rgba(255, 0, 85, 0.45);
        }
        .logo-text {
            font-size: 17px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -0.3px;
        }
        .status-pill {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 11.5px;
            font-weight: 800;
            padding: 4px 12px;
            border-radius: 14px;
            background: rgba(16, 185, 129, 0.18);
            color: #34d399;
            border: 1.5px solid rgba(52, 211, 153, 0.45);
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 10px #10b981;
        }

        .card {
            background: rgba(15, 23, 42, 0.8);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        .card-header {
            font-size: 13px;
            font-weight: 900;
            color: #cbd5e1;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .card-header a {
            color: #38bdf8;
            text-decoration: none;
            font-size: 12px;
            font-weight: 800;
        }
        .card-header a:hover { text-decoration: underline; }

        .lang-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .lang-btn {
            background: rgba(30, 41, 59, 0.85);
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 9px 4px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            font-family: 'Vazirmatn', sans-serif;
        }
        .lang-btn:hover {
            background: #334155;
            color: #ffffff;
            transform: translateY(-2px);
        }
        .lang-btn.active {
            background: linear-gradient(135deg, #ff0055 0%, #7c3aed 100%);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 14px rgba(255, 0, 85, 0.4);
        }

        .input-group {
            display: flex;
            gap: 8px;
        }
        input {
            flex: 1;
            background: #020617;
            border: 1.5px solid #334155;
            border-radius: 12px;
            padding: 10px 14px;
            color: white;
            font-size: 13px;
            font-family: monospace;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: #8b5cf6; }
        .btn-action {
            background: #334155;
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 0 16px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Vazirmatn', sans-serif;
        }
        .btn-action:hover {
            background: #475569;
            transform: translateY(-1px);
        }

        .btn-primary-gradient {
            width: 100%;
            background: linear-gradient(135deg, #ff0055 0%, #7c3aed 100%);
            color: white;
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            padding: 14px;
            font-size: 14.5px;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.25s ease;
            margin-bottom: 12px;
            text-decoration: none;
            box-shadow: 0 6px 20px rgba(255, 0, 85, 0.45);
        }
        .btn-primary-gradient:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 28px rgba(255, 0, 85, 0.6);
        }

        .msg {
            font-size: 12px;
            margin-top: 10px;
            font-weight: 800;
            display: none;
            line-height: 1.6;
        }
        .msg.success { color: #34d399; display: block; }
        .msg.error { color: #f87171; display: block; }

        .footer {
            text-align: center;
            font-size: 12px;
            color: #64748b;
            margin-top: 12px;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-area">
            <div class="logo-icon">▶</div>
            <div class="logo-text">TubeDigest AI 4.0</div>
        </div>
        <div id="statusBadge" class="status-pill">
            <span class="status-dot"></span>
            <span>موتور شناختی فعال</span>
        </div>
    </div>

    <!-- Language Selector -->
    <div class="card">
        <div class="card-header">
            <span>🌐 زبان پیش‌فرض خلاصه ویدیو:</span>
        </div>
        <div class="lang-grid" id="popupLangGrid">
            <button class="lang-btn active" data-lang="fa">🇮🇷 فارسی</button>
            <button class="lang-btn" data-lang="en">🇬🇧 English</button>
            <button class="lang-btn" data-lang="ar">🇸🇦 العربية</button>
            <button class="lang-btn" data-lang="tr">🇹🇷 Türkçe</button>
            <button class="lang-btn" data-lang="es">🇪🇸 Español</button>
            <button class="lang-btn" data-lang="de">🇩🇪 Deutsch</button>
        </div>
    </div>

    <!-- Cloud Engine Key Config -->
    <div class="card" style="border-color: rgba(139, 92, 246, 0.5);">
        <div class="card-header">
            <span>🔑 اتصال به هسته هوشمند ابری:</span>
            <span style="color:#38bdf8; font-size:11px; font-weight:700;">اختصاصی TubeDigest</span>
        </div>
        <div class="input-group">
            <input type="password" id="geminiApiKeyInput" placeholder="کلید اتصال هوشمند فعال است...">
            <button class="btn-action" id="saveApiKeyBtn">ذخیره</button>
        </div>
        <div id="apiMsg" class="msg"></div>
    </div>

    <!-- Pro License Activation & Usage Status -->
    <div class="card" id="licenseCard">
        <div class="card-header">
            <span>👑 لایسنس نسخه Pro:</span>
            <span id="usagePill" style="font-size:11px; color:#f59e0b; font-weight:800;">۰ از ۳ رایگان</span>
        </div>
        <div style="display:flex; flex-direction:column; gap:8px;">
            <input type="email" id="licenseEmailInput" placeholder="ایمیل خرید (user@gmail.com)" style="width:100%;">
            <div class="input-group">
                <input type="text" id="licenseKeyInput" placeholder="کد لایسنس (مثال: PRO-XXXX)">
                <button class="btn-action" id="activateBtn">فعالسازی</button>
            </div>
        </div>
        <div id="licenseMsg" class="msg"></div>
    </div>

    <!-- Buy Link (Sellix) -->
    <a href="https://sellix.io" target="_blank" class="btn-primary-gradient" id="buyLink">
        <span>خرید لایسنس دائمی با تتر (4.99 USDT)</span>
    </a>

    <div class="footer">
        سیستم تحلیل فوق‌پیشرفته و موتور پردازش شناختی TubeDigest AI
    </div>

    <script src="popup.js"></script>
</body>
</html>
